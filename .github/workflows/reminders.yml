name: reminders

# Each subscription stores the LOCAL hours it wants and the script picks the
# latest slot that has already passed -- one cron job covers every timezone.
#
# Twice an hour, and deliberately NOT on the hour. GitHub's scheduler is
# best-effort and the top of the hour is when it is busiest: with
# '0 * * * *' this repo was getting four or five runs a day instead of
# twenty-four, so a 20:00 reminder could arrive at midnight or not at all.
# Running twice costs nothing -- the script records the slot it sent and
# skips it the second time.
on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:        # so it can be fired by hand to test
    inputs:
      test_uid:
        description: 'Send only to this uid, ignoring the schedule (leave blank for a normal run)'
        required: false
        default: ''
      force:
        description: 'Ignore the local-hour check and send to everyone now'
        type: boolean
        required: false
        default: false

# Nothing here writes to the repository.
permissions:
  contents: read

# Never two at once: both would read "not sent yet" and both would send.
concurrency:
  group: reminders
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tools/package-lock.json
      # `npm ci` installs exactly what tools/package-lock.json names, checked
      # against its hashes, and runs no install scripts. This step used to be
      # `npm install web-push firebase-admin`, which took whatever was newest:
      # web-push 4.0.0 came out on 2026-11-06 with a different export shape and
      # every run failed for four days. This job holds the service account and
      # the VAPID key -- it should never run a release nobody has looked at.
      - run: npm ci --ignore-scripts
        working-directory: tools
      - run: node tools/send-reminders.mjs
        env:
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          TEST_UID: ${{ github.event.inputs.test_uid }}
          FORCE: ${{ github.event.inputs.force }}
